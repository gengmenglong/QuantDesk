services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantdesk
      POSTGRES_PASSWORD: quantdesk-local-test
      POSTGRES_DB: quantdesk
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Builds the SPA and publishes dist/ into a shared volume, then exits.
  # `api` waits for it so a clean clone needs no local Node install.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/app/dist
    restart: "no"

  # One-shot schema migration. api/worker must not start before it succeeds,
  # otherwise the lifespan bootstrap would insert into a missing runtime table.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      QD_DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk-local-test@db:5432/quantdesk
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn quantdesk.api:app --host 127.0.0.1 --port 8000
    environment:
      QD_DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk-local-test@db:5432/quantdesk
      # Outside demo mode the API refuses to start without a master key, so credentials
      # can never be written unencrypted. Generate one per docs/deployment.md.
      QD_MASTER_KEY: ${QD_MASTER_KEY:-}
      QD_SESSION_TOKEN: ${QD_SESSION_TOKEN:-}
      QD_MODE: ${QD_MODE:-live}
      QD_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8000,http://localhost:8000
      QD_FRONTEND_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - frontend_dist:/app/frontend/dist:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m quantdesk.worker
    environment:
      QD_DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk-local-test@db:5432/quantdesk
      QD_MASTER_KEY: ${QD_MASTER_KEY:-}
      QD_SESSION_TOKEN: ${QD_SESSION_TOKEN:-}
      QD_MODE: ${QD_MODE:-live}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:
