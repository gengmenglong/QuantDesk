[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "cryptography>=44", "pydantic-settings>=2.7,<3", "exchange-calendars>=4.9,<5"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["quantdesk*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
